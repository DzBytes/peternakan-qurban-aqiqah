<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking & Jadwal - Berkah Farm</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .status-box { 
            padding: 15px; 
            border-radius: 10px; 
            margin-top: 15px; 
            font-size: 0.9rem; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .status-box.selesai { 
            background: rgba(46, 204, 113, 0.1); 
            border: 1px solid var(--primary-color); 
            color: var(--primary-color); 
        }
        .status-box.proses { 
            background: rgba(52, 152, 219, 0.1); 
            border: 1px solid #3498db; 
            color: #3498db; 
        }
        .status-box.pending { 
            background: rgba(241, 196, 15, 0.1); 
            border: 1px solid #f1c40f; 
            color: #f1c40f; 
        }
        /* Style untuk Tracking */
        .tracking-info {
            margin-top: 15px; 
            padding: 15px; 
            background: #e8f5e9; 
            border-radius: 8px; 
            border-left: 5px solid #2ecc71;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tracking-waiting {
            margin-top: 15px; 
            color: #7f8c8d; 
            font-size: 0.9rem; 
            padding: 15px; 
            background: #f8f9fa; 
            border-radius: 8px;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-video {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-video:hover {
            background-color: #219150;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div class="container" style="max-width: 800px;">
        <h2 style="margin-bottom: 25px;"><i class="fas fa-route"></i> Pelacakan Pesanan</h2>
        <div id="jadwalContainer">
            <p style="text-align:center;">Memuat data...</p>
        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script>
        const userId = localStorage.getItem('user_id');

        document.addEventListener('DOMContentLoaded', async () => {
            if(!userId) window.location.href = 'login.html';
            try {
                const res = await fetch(`http://localhost:3000/api/pesanan?user_id=${userId}`);
                const data = await res.json();
                renderJadwal(data);
            } catch(e) { 
                console.error(e);
                document.getElementById('jadwalContainer').innerHTML = "<p style='text-align:center; color:red;'>Gagal memuat data.</p>";
            }
        });

        function renderJadwal(list) {
            const container = document.getElementById('jadwalContainer');
            container.innerHTML = '';
            
            // Filter: Tampilkan yang statusnya relevan
            const activeList = list.filter(d => ['dibayar', 'diproses', 'selesai', 'menunggu_verifikasi'].includes(d.status_pesanan));

            if(activeList.length === 0) {
                container.innerHTML = `<div class="glass-card" style="text-align:center; padding:30px;">Belum ada pesanan yang diproses. Silakan lakukan pembayaran terlebih dahulu.</div>`;
                return;
            }

            activeList.forEach(item => {
                let statusText = 'Menunggu Verifikasi Pembayaran';
                let statusClass = 'pending';
                let icon = 'fa-clock';
                
                // --- 1. Tentukan Status Utama ---
                if (item.status_pesanan === 'diproses' || item.status_pesanan === 'dibayar') {
                    statusText = 'Sedang Diproses / Dalam Pengiriman';
                    statusClass = 'proses';
                    icon = 'fa-truck';
                } else if (item.status_pesanan === 'selesai') {
                    // TEXT DIUBAH: Dari "Ibadah Selesai" ke "Pesanan Selesai"
                    statusText = 'Pesanan Selesai & Terdistribusi';
                    statusClass = 'selesai';
                    icon = 'fa-check-circle';
                }

                // --- 2. Logika Tracking Distribusi ---
                let trackingHtml = '';
                
                if (item.lacak_distribusi && item.lacak_distribusi !== 'null') {
                    // TAMPILKAN UPDATE DARI ADMIN (JIKA ADA DATA)
                    trackingHtml = `
                        <div class="tracking-info">
                            <div style="margin-bottom:8px; font-weight:bold; color:#27ae60;">
                                <i class="fas fa-map-marker-alt"></i> Posisi Paket Terkini:
                            </div>
                            <div style="color:#2d3436; font-size:1rem; line-height:1.5;">
                                ${item.lacak_distribusi}
                            </div>
                            <div style="margin-top:10px; font-size:0.8rem; color:#7f8c8d; border-top:1px solid #dcdcdc; padding-top:5px;">
                                *Pantau terus halaman ini untuk update lokasi terbaru.
                            </div>
                        </div>`;
                } else {
                    // BELUM ADA UPDATE DARI ADMIN
                    trackingHtml = `
                        <div class="tracking-waiting">
                            <i class="fas fa-spinner fa-spin fa-lg"></i> 
                            <div>
                                <strong>Menunggu Update Lokasi</strong><br>
                                <span style="font-size:0.85rem">Admin belum mengupdate lokasi terkini. Mohon tunggu...</span>
                            </div>
                        </div>`;
                }

                // --- 3. Link Video (Jika Ada) ---
                let videoLink = '';
                if(item.link_video_pemotongan) {
                    videoLink = `
                        <div style="text-align:right">
                            <a href="${item.link_video_pemotongan}" target="_blank" class="btn-video">
                                <i class="fas fa-play"></i> Tonton Video Pemotongan
                            </a>
                        </div>`;
                }

                // --- 4. Render Kartu ---
                container.innerHTML += `
                    <div class="glass-card">
                        <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:15px;">
                            <div>
                                <h3 style="margin:0; color:var(--primary-color)">${item.jenis_hewan}</h3>
                                <div style="font-size:0.85rem; color:#7f8c8d; margin-top:5px;">Order ID: #${item.id}</div>
                            </div>
                            <div style="text-align:right; font-size:0.9rem;">
                                <div><i class="fas fa-calendar"></i> Jadwal Potong: <br><strong>${item.jadwal_pemotongan ? new Date(item.jadwal_pemotongan).toLocaleDateString('id-ID') : '-'}</strong></div>
                            </div>
                        </div>
                        
                        <div class="status-box ${statusClass}">
                            <i class="fas ${icon} fa-2x"></i>
                            <div>
                                <div style="font-weight:bold; font-size:1rem;">${statusText}</div>
                                <div style="font-size:0.85rem; opacity:0.8;">Status saat ini</div>
                            </div>
                        </div>

                        ${trackingHtml}

                        ${videoLink}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
