<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Notifikasi</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .settings-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .setting-item:last-child { border-bottom: none; }
        
        .setting-label h4 { margin: 0; color: #2c3e50; }
        .setting-label p { margin: 5px 0 0; font-size: 0.85rem; color: #7f8c8d; }

        /* Toggle Switch Style */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="container" style="max-width: 700px;">
        <h2 style="margin-bottom: 25px;"><i class="fas fa-bell"></i> Pengaturan Notifikasi</h2>

        <form id="notifForm" onsubmit="simpanPengaturan(event)">
            <div class="settings-card">
                
                <div class="setting-item">
                    <div class="setting-label">
                        <h4><i class="fas fa-sign-in-alt"></i> Aktivitas Login</h4>
                        <p>Dapatkan notifikasi setiap kali akun Anda login.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="notify_login">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <h4><i class="fas fa-shopping-cart"></i> Transaksi & Pembelian</h4>
                        <p>Info status pesanan, pembayaran, dan tagihan cicilan.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="notify_pembayaran">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-label">
                        <h4><i class="fas fa-tag"></i> Promo & Penawaran</h4>
                        <p>Berita diskon dan penawaran hewan terbaru.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="notify_promosi">
                        <span class="slider"></span>
                    </label>
                </div>

            </div>

            <button type="submit" class="btn-primary" style="width: 100%; padding: 12px;">
                <i class="fas fa-save"></i> Simpan Perubahan
            </button>
        </form>
    </div>

    <script src="js/navbar.js"></script>
    <script>
        const userId = localStorage.getItem('user_id');

        document.addEventListener('DOMContentLoaded', async () => {
            if(!userId) {
                alert("Silakan login terlebih dahulu");
                window.location.href = 'login.html';
                return;
            }
            await loadSettings();
        });

        async function loadSettings() {
            try {
                const res = await fetch(`http://localhost:3000/api/user/${userId}/settings-notif`);
                const data = await res.json();
                
                // Set status checkbox berdasarkan data database (1 = checked, 0 = unchecked)
                document.getElementById('notify_login').checked = (data.notify_login === 1);
                document.getElementById('notify_pembayaran').checked = (data.notify_pembayaran === 1);
                document.getElementById('notify_promosi').checked = (data.notify_promosi === 1);
            } catch (err) {
                console.error(err);
                // Default nyalakan jika error/data baru
                document.getElementById('notify_login').checked = true;
                document.getElementById('notify_pembayaran').checked = true;
            }
        }

        async function simpanPengaturan(e) {
            e.preventDefault();
            
            const payload = {
                notify_login: document.getElementById('notify_login').checked ? 1 : 0,
                notify_pembayaran: document.getElementById('notify_pembayaran').checked ? 1 : 0,
                notify_promosi: document.getElementById('notify_promosi').checked ? 1 : 0
            };

            try {
                const res = await fetch(`http://localhost:3000/api/user/${userId}/settings-notif`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    alert("Pengaturan notifikasi berhasil disimpan!");
                } else {
                    alert("Gagal menyimpan pengaturan.");
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan koneksi.");
            }
        }
    </script>
</body>
</html>
